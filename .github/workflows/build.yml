name: Build Nexa APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      - name: Grant execute permission
        run: chmod +x gradlew || true
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.2
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Show APK SHA Fingerprints
        run: |
          echo "═══════════════════════════════════════"
          echo "APK SIGNATURE FINGERPRINTS"
          echo "═══════════════════════════════════════"
          KEYSTORE=~/.android/debug.keystore
          if [ -f "$KEYSTORE" ]; then
            echo "✅ Debug keystore found at: $KEYSTORE"
            keytool -list -v -keystore "$KEYSTORE" -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"
          else
            echo "❌ Debug keystore not found. Trying app build folder..."
            find app/build -name "*.apk" -exec echo "APK: {}" \;
          fi
          echo ""
          echo "═══════════════════════════════════════"
          echo "Copy the SHA1 or SHA256 above and add it to Firebase!"
          echo "═══════════════════════════════════════"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
