name: Build Nexa Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission
        run: chmod +x gradlew || true

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          # Strip ALL whitespace and newlines before decoding
          printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r\t' | base64 -d > app/nexa-release.keystore
          echo "Keystore size:"
          ls -la app/nexa-release.keystore
          echo "First bytes (should be PK or binary):"
          head -c 20 app/nexa-release.keystore | xxd | head -2

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Show APK
        run: |
          echo "==========================================="
          ls -la app/build/outputs/apk/release/
          echo "==========================================="

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
