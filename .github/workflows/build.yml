name: Build Nexa Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# এটা খুব জরুরি, না হলে Release create করতে পারবে না
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission
        run: chmod +x gradlew || true

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r\t' | base64 -d > app/nexa-release.keystore
          ls -la app/nexa-release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Show APK
        run: |
          ls -la app/build/outputs/apk/release/

      - name: Rename APK to stable name
        run: |
          # ফাইলের নাম সবসময় এক রাখছি যাতে Direct Link কখনো change না হয়
          cd app/build/outputs/apk/release/
          mv app-release.apk nexa.apk || mv *.apk nexa.apk
          ls -la

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: nexa-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Release APK for Direct Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Nexa Latest Build"
          body: "Auto build from main branch - ${{ github.event.head_commit.message }}"
          files: app/build/outputs/apk/release/nexa.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
